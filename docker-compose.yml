# Production : images buildées + Traefik. Dev hot reload : docker-compose.dev.yml (make dev-up).

networks:
  app_backend:
    driver: bridge
    ipam:
      config:
        - subnet: 10.10.13.0/24
  traefik_web_bk:
    external: true

services:
  db:
    container_name: ${FULLNAME}-db
    image: mariadb:10.11
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - ./data/mariadb:/var/lib/mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    labels:
      - "traefik.enable=false"
    networks:
      app_backend:
        ipv4_address: 10.10.13.2
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    container_name: ${FULLNAME}-api
    build: ./backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: ${FULLNAME}-db
      DB_PORT: 3306
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      CORS_ORIGIN: https://${DOMAIN}
      UPLOAD_DIR: /app/uploads
      API_PUBLIC_URL: https://${API_DOMAIN}
      NOMINATIM_USER_AGENT: ${NOMINATIM_USER_AGENT}
    volumes:
      - ./data/uploads:/app/uploads
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.${FULLNAME}-api.rule=Host(`${API_DOMAIN}`)"
      - "traefik.http.routers.${FULLNAME}-api.entrypoints=web,websecure"
      - "traefik.http.routers.${FULLNAME}-api.tls=true"
      - "traefik.http.routers.${FULLNAME}-api.tls.certresolver=lets-encrypt"
      - "traefik.http.services.${FULLNAME}-api.loadbalancer.server.port=3000"
    networks:
      traefik_web_bk: {}
      app_backend:
        ipv4_address: 10.10.13.3
    depends_on:
      db:
        condition: service_healthy

  frontend:
    container_name: ${FULLNAME}-web
    build:
      context: ./frontend
      args:
        # Même origine : Nginx proxy /api → backend (évite souci cert sur sous-domaine API)
        VITE_API_BASE_URL: https://${DOMAIN}/api
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.${FULLNAME}-web.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.${FULLNAME}-web.entrypoints=web,websecure"
      - "traefik.http.routers.${FULLNAME}-web.tls=true"
      - "traefik.http.routers.${FULLNAME}-web.tls.certresolver=lets-encrypt"
      - "traefik.http.services.${FULLNAME}-web.loadbalancer.server.port=80"
    networks:
      traefik_web_bk: {}
      app_backend: {}
    depends_on:
      - backend
