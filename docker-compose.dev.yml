# Développement : volumes + hot reload, exposé sur le vrai domaine via Traefik.
# Usage : make dev-up
# URL : https://${DOMAIN} — API : https://${DOMAIN}/api

networks:
  traefik_web_bk:
    external: true

services:
  db:
    container_name: ${FULLNAME}-db
    image: mariadb:10.11
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - ./data/mariadb:/var/lib/mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    labels:
      - "traefik.enable=false"
    ports:
      - "${DB_PORT:-3307}:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    container_name: ${FULLNAME}-api-dev
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npx knex migrate:latest && npm run dev"
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 3000
      DB_HOST: db
      DB_PORT: 3306
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      CORS_ORIGIN: https://${DOMAIN}
      UPLOAD_DIR: /app/uploads
      API_PUBLIC_URL: https://${DOMAIN}
      SITE_PUBLIC_URL: https://${DOMAIN}
      NOMINATIM_USER_AGENT: ${NOMINATIM_USER_AGENT}
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
      - ./data/uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  frontend:
    container_name: ${FULLNAME}-web-dev
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: https://${DOMAIN}/api
      VITE_PROXY_TARGET: http://backend:3000
      VITE_HMR_HOST: ${DOMAIN}
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.${FULLNAME}-web-dev.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.${FULLNAME}-web-dev.entrypoints=web,websecure"
      - "traefik.http.routers.${FULLNAME}-web-dev.tls=true"
      - "traefik.http.routers.${FULLNAME}-web-dev.tls.certresolver=lets-encrypt"
      - "traefik.http.services.${FULLNAME}-web-dev.loadbalancer.server.port=5173"
    networks:
      - default
      - traefik_web_bk
    depends_on:
      - backend

volumes:
  backend_node_modules:
  frontend_node_modules:
